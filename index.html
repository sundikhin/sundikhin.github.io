<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sundi Myint</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #f4efe6;
      --bg-accent: #e8dfd0;
      --text: #2b2a28;
      --muted: #6b6459;
      --accent: #3f7d6e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1f24;
        --bg-accent: #252a31;
        --text: #e6e1d8;
        --muted: #a39d92;
        --accent: #7cc4b1;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, var(--bg-accent), var(--bg) 70%);
      background-color: var(--bg);
      color: var(--text);
      text-align: center;
      padding: 0 16px;
    }
    h1 { font-size: 2.5rem; margin: 0 0 0.75rem; }
    h1::after {
      content: "";
      display: block;
      width: 48px;
      height: 3px;
      margin: 0.75rem auto 0;
      border-radius: 2px;
      background: var(--accent);
    }
    p { font-size: 1.1rem; color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <p>Hi, I'm Sundi Myint. A new site is on the way — check back soon.</p>
  </main>
</body>
</html>
